<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit · https://www.agglo-saint-louis.fr/</title>
  <style>
    :root {
      --bg: #f5f0e6;
      --surface: #fffdf8;
      --sunken: #ece4d2;
      --amber: #e8b95e;
      --amber-deep: #c9822d;
      --amber-light: #ffd98a;
      --fg: rgba(26,31,56,0.95);
      --fg-muted: rgba(26,31,56,0.72);
      --fg-dim: rgba(26,31,56,0.52);
      --fg-faint: rgba(26,31,56,0.30);
      --hairline-soft: rgba(26,31,56,0.08);
      --hairline: rgba(26,31,56,0.14);
      --success: #5f9669;
      --danger: #c0453f;
      --display: "SF Pro Display", Inter, system-ui, sans-serif;
      --text: "SF Pro Text", Inter, system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .header__eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--amber-deep);
      text-transform: uppercase;
    }

    .header__sep {
      width: 1px;
      height: 14px;
      background: var(--hairline);
      flex-shrink: 0;
    }

    .header__site {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-dim);
    }

    .header__spacer { flex: 1; }

    .header__pill {
      background: var(--sunken);
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .tension-card {
      background: var(--surface);
      border: 1px solid var(--hairline-soft);
      border-radius: 13px;
      padding: 16px 18px;
      box-shadow: 0 1px 2px rgba(26,31,56,0.04);
      position: relative;
      padding-left: 22px;
      overflow: hidden;
    }

    .tension-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 13px 0 0 13px;
    }

    .tension-card--dated-pattern::before  { background: var(--danger); }
    .tension-card--ia-clutter::before     { background: var(--amber-deep); }
    .tension-card--density::before        { background: var(--fg-dim); }
    .tension-card--cliche::before         { background: var(--danger); }
    .tension-card--missed-opportunity::before { background: var(--success); }

    .tension-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      gap: 8px;
    }

    .tension-card__number {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-faint);
      letter-spacing: 0.06em;
      margin-left: auto;
      flex-shrink: 0;
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 3px 9px;
    }

    .tag--dated-pattern { background: rgba(192,69,63,0.10); color: #c0453f; }
    .tag--ia-clutter { background: rgba(201,130,45,0.10); color: var(--amber-deep); }
    .tag--density { background: rgba(26,31,56,0.07); color: var(--fg-dim); }
    .tag--cliche { background: rgba(192,69,63,0.10); color: #c0453f; }
    .tag--missed-opportunity { background: rgba(95,150,105,0.10); color: var(--success); }

    .tension-card__title {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .tension-card__body {
      font-family: var(--text);
      font-size: 13px;
      color: var(--fg-muted);
      line-height: 1.6;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .stagger > * {
      opacity: 0;
      animation: riseIn .5s var(--ease) forwards;
    }

    .stagger > *:nth-child(1) { animation-delay: .04s; }
    .stagger > *:nth-child(2) { animation-delay: .10s; }
    .stagger > *:nth-child(3) { animation-delay: .16s; }
    .stagger > *:nth-child(4) { animation-delay: .22s; }
    .stagger > *:nth-child(5) { animation-delay: .28s; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header__eyebrow">Audit</span>
    <span class="header__sep"></span>
    <span class="header__site">https://www.agglo-saint-louis.fr/</span>
    <span class="header__spacer"></span>
    <span class="header__pill" id="count-pill"></span>
  </div>

  <div class="stagger" id="cards"></div>

  <!-- Data island: raw JSON, safe from shell escaping -->
  <script id="tensions-data" type="application/json">
[
  {
    "category": "density",
    "title": "Quick-links are almost unreadable (2.40:1 contrast)",
    "body": "The \"ACCÈS DIRECTS\" menu — the most load-bearing utility list on the page — uses muted gray #9C9C9C on warm-stone #F4EFEB, measuring only 2.40:1, far below the WCAG 4.5:1 floor. Fix: set the links to deep-navy ink #013C54 (~11:1), reserve cyan/green for hover, and keep only the line icons muted."
  },
  {
    "category": "density",
    "title": "Brand-colour text fails contrast where it carries meaning",
    "body": "Cyan section titles (#00ADEF) sit at 2.55:1 on white / 2.24:1 on stone, and white CTA labels on grass-green #73B72A measure 2.46:1 — all below the 3:1 large and 4.5:1 body thresholds. Fix: darken title cyan toward #013C54 for text, darken the button green to ~#4E8017 so white labels clear 4.5:1; keep bright hues for fills and large display only."
  },
  {
    "category": "dated-pattern",
    "title": "Flat type scale — headings the same size as body",
    "body": "A single family (Open Sans, ad-hoc scale 11.9 → 13 → 14 → 36px) where section titles sit at 14px — identical to body copy — so nothing reads as a heading. The 11.9px nav and 14px body read small on a 1440px canvas. This is the default WordPress-theme look (theme ca3f, © 2019). Fix: add a real display step (clamped 28–40px section titles) and lift body to 16px, keeping Open Sans for identity."
  },
  {
    "category": "missed-opportunity",
    "title": "Hero photography — the strongest asset — is thumbnailed",
    "body": "The documentary landscape photography of the tri-border territory (Petite Camargue canal hero, aerial villages, ZAC aerials) is cropped to a ~420px-tall strip and thumbnail project images. The \"Terres d'avenir\" identity is carried by photography, yet the layout starves it of room. Fix: promote the hero to a full-viewport edge-to-edge image with the logo and one clear CTA; give Grands Projets and concertations feature-scale imagery."
  },
  {
    "category": "ia-clutter",
    "title": "Portal-of-lists IA with no primary above-fold task",
    "body": "A 7-item news carousel, a 10-item ACCÈS DIRECTS list, GRANDS PROJETS, a separate OPEN DATA block, and a concertations carousel all read at the same visual weight, with no single clear entry point above the fold. CTA voice is fragmented (\"En savoir plus\" vs \"VOIR TOUS LES PROJETS\" vs \"VOIR TOUTES LES CONCERTATIONS PUBLIQUES\"). Fix: establish one primary above-the-fold task band (search + top 3–4 citizen actions as tiles), demote the rest to a secondary tier, and canonicalise the \"see all\" CTA voice."
  }
]
  </script>

  <script>
    var TENSIONS = JSON.parse(document.getElementById('tensions-data').textContent);

    var CATEGORY_LABELS = {
      'dated-pattern': 'Dated Pattern',
      'ia-clutter': 'IA / Clutter',
      'density': 'Density',
      'cliche': 'Cliché',
      'missed-opportunity': 'Missed Opportunity'
    };

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('count-pill').textContent = TENSIONS.length + ' tensions found';

    var container = document.getElementById('cards');
    TENSIONS.forEach(function(t, i) {
      var cat = t.category || 'density';
      container.insertAdjacentHTML('beforeend',
        '<article class="tension-card tension-card--' + cat + '">' +
          '<div class="tension-card__top">' +
            '<span class="tag tag--' + cat + '">' + escHtml(CATEGORY_LABELS[cat] || cat) + '</span>' +
            '<span class="tension-card__number">' + String(i + 1).padStart(2, '0') + '</span>' +
          '</div>' +
          '<h2 class="tension-card__title">' + escHtml(t.title) + '</h2>' +
          '<p class="tension-card__body">' + escHtml(t.body) + '</p>' +
        '</article>'
      );
    });
  </script>
</body>
</html>
